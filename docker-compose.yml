services:
  homelab-ollama:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - OLLAMA_MANAGED_BY_SERVICE=1
      - OLLAMA_HOST=0.0.0.0
      - STATE_DIR=/data
    ports:
      - "${SERVICE_PORT:-5000}:${SERVICE_PORT:-5000}"
      - "${OLLAMA_PORT:-11434}:${OLLAMA_PORT:-11434}"
    volumes:
      - ${DATA_DIR:-/var/lib/homelab-ollama}:/data
      - ollama-models:/root/.ollama
    devices:
      - "nvidia.com/gpu=all"

volumes:
  ollama-models:
